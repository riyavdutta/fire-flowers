<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fire Flowers 花火</title>
<meta name="description" content="A small game of flowers and fireworks over a river. Fire flowers by night, real flowers by day.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎆</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;600&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--fg:#eef0ff;--dim:rgba(238,240,255,.58);--glass:rgba(10,14,40,.55);--line:rgba(238,240,255,.14);--halo:#070a1f}
body.day{--fg:#2a2a4a;--dim:rgba(42,42,74,.6);--glass:rgba(255,255,255,.5);--line:rgba(42,42,74,.14);--halo:#eaf3ff}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#070a1f;color:var(--fg);overflow:hidden;font-family:"Zen Kaku Gothic New",sans-serif;transition:color 1.2s}
canvas{display:block;position:fixed;inset:0;width:100vw;height:100vh;touch-action:none;cursor:crosshair}
.title,.card{text-shadow:0 0 18px var(--halo),0 0 4px var(--halo)}
.title{position:fixed;left:34px;top:28px;pointer-events:none}
.title h1{font-family:"Shippori Mincho",serif;font-weight:400;font-size:34px;margin:0;letter-spacing:.04em}
.title h1 span{font-size:20px;opacity:.6;margin-left:10px}
.title p{margin:6px 0 0;font-size:13px;color:var(--dim);letter-spacing:.04em;max-width:32ch;line-height:1.5}
.card{position:fixed;right:34px;top:28px;text-align:right;max-width:300px;pointer-events:none}
.card .k{font-size:11px;letter-spacing:.24em;color:var(--dim)}
.card .q{font-family:"Shippori Mincho",serif;font-size:21px;line-height:1.35;margin-top:6px}
.marks{display:flex;gap:12px;justify-content:flex-end;margin-top:10px;font-size:12px;color:var(--dim);min-height:18px}
.marks .ok{color:#3fe0a8}.marks .no{opacity:.45;text-decoration:line-through}
/* day / night switch */
.seasons{position:fixed;left:50%;top:78px;transform:translateX(-50%);display:flex;gap:2px;padding:3px;border-radius:999px;background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);z-index:2}
.seasons button{font-family:"Shippori Mincho",serif;font-size:14px;color:var(--fg);background:none;border:0;border-radius:999px;padding:4px 11px;cursor:pointer;opacity:.5;transition:.4s;display:flex;gap:5px;align-items:baseline}
.seasons button small{font-family:"Zen Kaku Gothic New",sans-serif;font-size:10px;letter-spacing:.08em}
.seasons button.on{opacity:1;background:var(--line)}
.mode{position:fixed;left:50%;top:26px;transform:translateX(-50%);display:flex;padding:4px;border-radius:999px;background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.mode button{font-family:"Shippori Mincho",serif;font-size:15px;color:var(--fg);background:none;border:0;border-radius:999px;padding:7px 16px;cursor:pointer;opacity:.55;transition:.4s;display:flex;gap:7px;align-items:center}
.mode button.on{opacity:1;background:var(--line)}
.mode svg{width:16px;height:16px}
.tray{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);display:flex;gap:18px;align-items:center;padding:12px 18px;border-radius:22px;
  background:var(--glass);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--line);transition:background 1.2s}
.shells,.cols{display:flex;gap:6px}
.shell{background:none;border:1px solid transparent;color:var(--fg);border-radius:14px;padding:6px 8px 5px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;font-family:inherit;min-width:58px;transition:.2s;opacity:.55}
.shell:hover{opacity:.9}
.shell.on{opacity:1;border-color:var(--line);background:var(--line)}
.shell svg{width:30px;height:30px}
.shell .jp{font-family:"Shippori Mincho";font-size:14px;line-height:1}
.shell .en{font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
.sep{width:1px;height:44px;background:var(--line)}
.colwrap{display:flex;flex-direction:column;gap:6px;align-items:center}
.colhint{font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
.col{width:24px;height:24px;border-radius:50%;border:0;cursor:pointer;padding:0;box-shadow:0 0 12px var(--c);background:var(--c);transition:.2s;position:relative}
.col.on{transform:scale(1.15);outline:1.5px solid var(--fg);outline-offset:3px}
.col .n{position:absolute;top:-7px;right:-7px;width:13px;height:13px;border-radius:50%;background:var(--fg);color:var(--halo);font-size:8.5px;font-weight:700;line-height:13px;display:none}
.col.on .n{display:block}
.preview{position:static;inset:auto;width:46px;height:46px;border-radius:50%;flex:none}
.corner{position:fixed;right:34px;bottom:30px;display:flex;gap:18px}
.corner button{font-size:12px;letter-spacing:.1em;color:var(--dim);background:none;border:none;cursor:pointer;font-family:inherit}
.corner button:hover{color:var(--fg)}
.sheet{position:fixed;inset:0;display:grid;place-items:center;background:rgba(5,6,20,.35);z-index:6}
.sheet[hidden]{display:none}
.sheet-in{background:var(--glass);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--line);border-radius:24px;padding:22px;text-align:center;width:min(560px,calc(100% - 32px))}
.sk{font-size:11px;letter-spacing:.24em;color:var(--dim);margin:0 0 12px}
#snapv{position:static;inset:auto;width:100%;height:auto;border-radius:12px;display:block;cursor:default}
.opts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.opts button{font-family:inherit;color:var(--fg);background:var(--line);border:1px solid transparent;border-radius:16px;padding:14px 8px 12px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;transition:.2s}
.opts button:hover{border-color:var(--fg)}
.opts button.done{background:#3fe0a8;color:#07261b}
.opts b{font-family:"Shippori Mincho",serif;font-weight:400;font-size:16px}.opts small{font-size:10.5px;color:var(--dim)}
.ic{display:block;border:1.5px solid currentColor;margin-bottom:8px;height:30px}.i-card{width:42px;border-radius:2px;border-bottom-width:6px}.i-desk{width:50px;border-radius:3px}.i-phone{width:16px;height:32px;border-radius:5px}
.sx{margin-top:12px;font-family:inherit;font-size:12px;letter-spacing:.1em;color:var(--dim);background:none;border:0;cursor:pointer}
@media (max-width:820px){.seasons{top:100px;left:34px;transform:none}.seasons small{display:none}.corner{display:flex!important;top:142px;left:34px;right:auto;bottom:auto;gap:14px}.corner #free{display:none}.opts small{display:none}
.tray{flex-wrap:wrap;justify-content:center;gap:8px;bottom:12px;width:calc(100% - 24px)}.sep,.preview{display:none}.shell{min-width:0;padding:4px}.card{max-width:46vw;top:76px}.card .q{font-size:16px}.title h1{font-size:24px}.title p{display:none}.corner{display:none}.mode{top:auto;bottom:auto;top:60px;left:34px;transform:none}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="title"><h1>Fire Flowers<span>花火</span></h1><p id="how">Choose a shell and up to three colours. Press and hold in the sky, and let go to launch. Holding longer makes a bigger bloom. Tap the river to float a lantern.</p></div>
<div class="mode" id="mode">
  <button data-m="day"><svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="3.2" fill="currentColor"/><g stroke="currentColor" stroke-width="1.2" stroke-linecap="round"><path d="M8 1v2M8 13v2M1 8h2M13 8h2M3 3l1.4 1.4M11.6 11.6L13 13M3 13l1.4-1.4M11.6 4.4L13 3"/></g></svg>昼 day</button>
  <button data-m="night" class="on"><svg viewBox="0 0 16 16"><path d="M11.5 10.5A5.5 5.5 0 0 1 5.5 2.6a5.5 5.5 0 1 0 6 7.9z" fill="currentColor"/></svg>夜 night</button>
</div>
<div class="seasons" id="seasons"><button data-s="spring">春<small>spring</small></button><button data-s="summer">夏<small>summer</small></button><button data-s="autumn">秋<small>autumn</small></button><button data-s="winter">冬<small>winter</small></button></div>
<div class="card"><div class="k" id="k"></div><div class="q" id="q"></div><div class="marks" id="marks"></div></div>
<div class="tray">
  <div class="shells" id="shells"></div><div class="sep"></div>
  <div class="colwrap"><div class="cols" id="cols"></div><div class="colhint">pick up to three</div></div>
  <canvas class="preview" id="pv" width="92" height="92"></canvas>
</div>
<div class="sheet" id="sheet" hidden><div class="sheet-in"><p class="sk">KEEP THIS SKY · 空を残す</p><canvas id="snapv"></canvas><div class="opts"><button data-f="card"><i class="ic i-card"></i><b>Postcard</b><small>with the date and a seal</small></button><button data-f="desk"><i class="ic i-desk"></i><b>Desktop</b><small>2560 × 1440 wallpaper</small></button><button data-f="phone"><i class="ic i-phone"></i><b>Phone</b><small>lock screen wallpaper</small></button></div><button class="sx" id="sx">close</button></div></div>
<div class="corner"><button id="keep">keep this sky ↓</button><button id="fin" hidden>finale ✦</button><button id="snd">sound on</button><button id="free">just play →</button></div>

<script>
/* ================= data ================= */
const COLS={sakura:"#ff7eb6",wisteria:"#ab8cff",kingfisher:"#45b4ff",jade:"#47f0b4",silver:"#f4f6ff",yuzu:"#fff06a"};
const DAYCOLS={sakura:"#ff8cbe",wisteria:"#9a7cf5",kingfisher:"#3f9bf0",jade:"#2fcf98",silver:"#ffffff",yuzu:"#ffd93b"};
const CNAME={day:{silver:"white"},night:{}};
const ic=(f)=>f; // icons are plain svg strings
const ICON={
 kiku:'<g stroke="currentColor" stroke-width="1.3" stroke-linecap="round">'+[...Array(12)].map((_,i)=>{const a=i*Math.PI/6;return `<line x1="${15+Math.cos(a)*4}" y1="${15+Math.sin(a)*4}" x2="${15+Math.cos(a)*13}" y2="${15+Math.sin(a)*13}"/>`}).join("")+'</g>',
 botan:[...Array(12)].map((_,i)=>{const a=i*Math.PI/6;return `<circle cx="${15+Math.cos(a)*11}" cy="${15+Math.sin(a)*11}" r="1.9" fill="currentColor"/>`}).join("")+[...Array(6)].map((_,i)=>{const a=i*Math.PI/3+.5;return `<circle cx="${15+Math.cos(a)*5}" cy="${15+Math.sin(a)*5}" r="1.5" fill="currentColor"/>`}).join(""),
 yanagi:'<g fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round">'+[-1,-.5,0,.5,1].map(d=>`<path d="M15 6 q${d*12} 2 ${d*13} 20"/>`).join("")+'</g>',
 wa:'<ellipse cx="15" cy="15" rx="12" ry="8" fill="none" stroke="currentColor" stroke-width="1.6" stroke-dasharray="1.5 2.6" transform="rotate(-18 15 15)"/><circle cx="15" cy="15" r="2" fill="currentColor"/>',
 senrin:[[8,9],[21,8],[15,16],[7,21],[22,21]].map(([x,y])=>`<circle cx="${x}" cy="${y}" r="3.6" fill="none" stroke="currentColor" stroke-width="1.1" stroke-dasharray="1 1.4"/>`).join(""),
 dkiku:'<g fill="currentColor">'+[...Array(14)].map((_,i)=>`<ellipse cx="15" cy="7" rx="1.2" ry="6" transform="rotate(${i*360/14} 15 15)"/>`).join("")+'</g>',
 dbotan:'<g fill="currentColor">'+[...Array(6)].map((_,i)=>`<ellipse cx="15" cy="8.5" rx="5" ry="6" opacity=".8" transform="rotate(${i*60} 15 15)"/>`).join("")+'</g>',
 fuji:'<g fill="currentColor">'+[0,1,2,3,4,5].map(i=>`<ellipse cx="${15+(i%2?2:-2)}" cy="${6+i*3.6}" rx="${4-i*.45}" ry="2" />`).join("")+'</g>',
 sakura:'<g fill="currentColor">'+[...Array(5)].map((_,i)=>`<path d="M15 15 C19 12 19 7 16.5 5.5 L15 7 L13.5 5.5 C11 7 11 12 15 15Z" transform="rotate(${i*72} 15 15)"/>`).join("")+'</g>',
 ajisai:'<g fill="currentColor">'+[[9,10],[20,9],[15,16],[9,21],[21,21]].map(([x,y])=>[0,1,2,3].map(k=>`<ellipse cx="${x}" cy="${y-2}" rx="1.6" ry="2.2" transform="rotate(${k*90} ${x} ${y})"/>`).join("")).join("")+'</g>',
};
const SHELLS=[ // one shell, two lives: sparks at night, petals by day
 {id:"kiku",  night:["菊","chrysanth.","kiku"],   day:["菊","chrysanth.","dkiku"]},
 {id:"botan", night:["牡丹","peony","botan"],     day:["牡丹","peony","dbotan"]},
 {id:"yanagi",night:["柳","willow","yanagi"],     day:["藤","wisteria","fuji"]},
 {id:"wa",    night:["輪","ring","wa"],           day:["桜","sakura","sakura"]},
 {id:"senrin",night:["千輪","thousand","senrin"], day:["紫陽花","hydrangea","ajisai"]},
];
const COMMISSIONS={
 night:[
  {text:"A kingfisher-blue chrysanthemum, high in the middle of the sky.",type:"kiku",col:"kingfisher",fx:.5,fy:.24,r:170},
  {text:"A small sakura peony, low on the left, just above the hills.",type:"botan",col:"sakura",fx:.27,fy:.46,r:95},
  {text:"A silver willow to weep over the river.",type:"yanagi",col:"silver",fx:.64,fy:.3,r:170},
  {text:"A wisteria ring, high on the right.",type:"wa",col:"wisteria",fx:.76,fy:.2,r:115},
  {text:"A thousand jade flowers, all at once.",type:"senrin",col:"jade",fx:.44,fy:.28,r:160}],
 day:[
  {text:"A cloud of cherry blossom, low over the left bank.",type:"wa",col:"sakura",fx:.3,fy:.45,r:110},
  {text:"Wisteria pouring down, high in the middle.",type:"yanagi",col:"wisteria",fx:.5,fy:.22,r:160},
  {text:"A blue hydrangea, small and bright on the right.",type:"senrin",col:"kingfisher",fx:.72,fy:.4,r:100},
  {text:"A yellow chrysanthemum, high on the right.",type:"kiku",col:"yuzu",fx:.74,fy:.2,r:140},
  {text:"A white peony, right in the middle.",type:"botan",col:"silver",fx:.5,fy:.32,r:150}],
};

/* ================= state + ui ================= */
let MODE="night",mT=0; // mT eases 0 (night) → 1 (day)
let shell="kiku",sel=["kingfisher"];
const prog={night:0,day:0};let freePlay=false;
const $=id=>document.getElementById(id);
const palette=()=>MODE==="day"?DAYCOLS:COLS;
function buildTray(){
  $("shells").innerHTML="";
  SHELLS.forEach(s=>{const [jp,en,icon]=s[MODE];const b=document.createElement("button");b.className="shell"+(s.id===shell?" on":"");
    b.innerHTML=`<svg viewBox="0 0 30 30">${ICON[icon]}</svg><span class="jp">${jp}</span><span class="en">${en}</span>`;
    b.onclick=()=>{shell=s.id;buildTray()};$("shells").appendChild(b)});
  $("cols").innerHTML="";
  Object.keys(COLS).forEach(k=>{const b=document.createElement("button");b.className="col"+(sel.includes(k)?" on":"");b.style.setProperty("--c",palette()[k]);b.title=CNAME[MODE][k]||k;
    b.innerHTML=`<span class="n">${sel.indexOf(k)+1}</span>`;
    b.onclick=()=>{ // tap toggles; two at most, the oldest drops off
      if(sel.includes(k)){if(sel.length>1)sel=sel.filter(x=>x!==k)}else{sel.push(k);if(sel.length>3)sel.shift()}
      buildTray()};$("cols").appendChild(b)});
  [...$("shells").children].forEach(b=>b.style.color=b.classList.contains("on")?palette()[sel[0]]:"");
  pvT=0;
}
function showCommission(){
  const list=COMMISSIONS[MODE],i=prog[MODE];$("marks").innerHTML="";
  if(freePlay||i>=list.length){$("k").textContent=MODE==="day"?"THE DAY IS YOURS":"THE NIGHT IS YOURS";$("q").textContent=i>=list.length?"All five bloomed. Fill the sky however you like.":"No commissions. Just the sky.";return}
  $("k").textContent=`${MODE==="day"?"DAY":"NIGHT"} COMMISSION · ${i+1} OF ${list.length}`;$("q").textContent=list[i].text;
}
function setMode(m){MODE=m;document.body.classList.toggle("day",m==="day");[...$("mode").children].forEach(b=>b.classList.toggle("on",b.dataset.m===m));buildTray();showCommission();setTarget()}
[...$("mode").children].forEach(b=>b.onclick=()=>{audio();setMode(b.dataset.m)});
$("free").onclick=()=>{freePlay=true;showCommission();setTarget()};
let muted=false;$("snd").onclick=()=>{audio();muted=!muted;$("snd").textContent=muted?"sound off":"sound on";if(MASTER)MASTER.gain.value=muted?0:.9};

/* ================= canvas ================= */
const cv=$("c"),ctx=cv.getContext("2d"),sky=document.createElement("canvas"),sx=sky.getContext("2d");
let W,H,HZ,DPR,stars=[],hills=[],lanterns=[],clouds=[],boats=[];
function resize(){
  DPR=Math.min(2,window.devicePixelRatio||1);W=innerWidth;H=innerHeight;HZ=Math.round(H*.7);
  cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);
  sky.width=W*DPR;sky.height=HZ*DPR;sx.setTransform(DPR,0,0,DPR,0,0);
  stars=[...Array(Math.round(W*H/5200))].map(()=>({x:Math.random()*W,y:Math.random()*HZ*.85,r:Math.random()*1.1+.2,p:Math.random()*6}));
  const far=[],near=[];for(let x=-10;x<=W+10;x+=W/14)far.push([x,HZ-38-Math.random()*70]);for(let x=-10;x<=W+10;x+=W/26)near.push([x,HZ-10-Math.random()*16]);hills=[far,near];
  lanterns=[...Array(Math.round(W/55))].map((_,i)=>({x:Math.random()*W,dy:Math.random()*5,c:["#ffd6ea","#f4f6ff","#ffe8f2"][i%3],p:Math.random()*6}));
  // boats on the river: two lantern houseboats (yakatabune) and one small punt, nearer ones bigger
  if(!boats.length)boats=[{k:"house",d:.1,s:.5,v:5,x:W*.22,ph:0},{k:"punt",d:.24,s:.62,v:-8,x:W*.7,ph:2},{k:"house",d:.36,s:.82,v:3.5,x:W*.55,ph:4}];
  clouds=[...Array(6)].map(()=>({x:Math.random()*W,y:HZ*(.12+Math.random()*.4),s:60+Math.random()*90,v:4+Math.random()*6}));
}
addEventListener("resize",resize);resize();
const hex2=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16));
const lerpC=(a,b,t)=>a.map((v,i)=>Math.round(v+(b[i]-v)*t));
const mixH=(n,d)=>`rgb(${lerpC(hex2(n),hex2(d),mT)})`; // night colour → day colour by mT

/* ================= sound ================= */
/* Night aims at a real festival heard from the riverbank: a mortar thud on launch, then a sharp
   crack, a deep body and a sub-bass, rolling back off the hills as echoes, with crackle and hiss
   after. Brown noise rather than white keeps it warm instead of harsh. Each sound sits in stereo
   where it bursts, and higher bursts are heard a moment after you see them. */
let AC=null,MASTER=null,VERB=null;
function audio(){
  if(AC)return;try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(_){return}
  const comp=AC.createDynamicsCompressor();comp.threshold.value=-16;comp.ratio.value=3;comp.attack.value=.004;comp.release.value=.3;
  MASTER=AC.createGain();MASTER.gain.value=muted?0:.9;MASTER.connect(comp).connect(AC.destination);
  // a soft, dark reverb: a smoothed noise tail, so it blooms instead of hissing
  VERB=AC.createConvolver();const len=Math.round(AC.sampleRate*2.8),ir=AC.createBuffer(2,len,AC.sampleRate);
  for(let c=0;c<2;c++){const d=ir.getChannelData(c);let lp=0;for(let i=0;i<len;i++){lp+=((Math.random()*2-1)-lp)*.18;d[i]=lp*2.2*Math.pow(1-i/len,2.6)}}
  VERB.buffer=ir;const wet=AC.createGain();wet.gain.value=.5;VERB.connect(wet).connect(MASTER);
  ambience();
}
function panFor(x){return Math.max(-.7,Math.min(.7,(x/W*2-1)*.7))}
function out(node,dry=1,wet=1,pan=0){
  let n=node;if(AC.createStereoPanner&&pan){const p=AC.createStereoPanner();p.pan.value=pan;node.connect(p);n=p}
  const g=AC.createGain();g.gain.value=dry;n.connect(g).connect(MASTER);const w=AC.createGain();w.gain.value=wet;n.connect(w).connect(VERB)}
function noise(dur){const b=AC.createBuffer(1,Math.max(1,AC.sampleRate*dur),AC.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;const s=AC.createBufferSource();s.buffer=b;return s}
function brown(dur){const b=AC.createBuffer(1,Math.max(1,AC.sampleRate*dur),AC.sampleRate),d=b.getChannelData(0);let l=0;for(let i=0;i<d.length;i++){l=(l+.02*(Math.random()*2-1))/1.02;d[i]=l*3.5}const s=AC.createBufferSource();s.buffer=b;return s}
function env(g,t,peak,att,dec){g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(peak,t+att);g.gain.exponentialRampToValueAtTime(.0001,t+att+dec)}
function mortar(x){ // the low thud of the shell leaving the tube
  if(!AC)return;const t=AC.currentTime,pan=panFor(x);
  const n=brown(.3),f=AC.createBiquadFilter(),g=AC.createGain();f.type="lowpass";f.frequency.value=220;env(g,t,.5,.004,.22);n.connect(f).connect(g);out(g,1,.35,pan);n.start(t);
  const o=AC.createOscillator(),og=AC.createGain();o.frequency.setValueAtTime(80,t);o.frequency.exponentialRampToValueAtTime(42,t+.14);env(og,t,.25,.003,.16);o.connect(og);out(og,1,.2,pan);o.start(t);o.stop(t+.25);
}
function rise(dur,day,x){ // a faint airy climb
  if(!AC)return;const t=AC.currentTime,n=day?noise(dur+.1):brown(dur+.1),f=AC.createBiquadFilter(),g=AC.createGain();
  f.type="bandpass";f.Q.value=.9;f.frequency.setValueAtTime(day?300:500,t);f.frequency.exponentialRampToValueAtTime(day?1100:1600,t+dur);
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(day?.04:.05,t+dur*.5);g.gain.linearRampToValueAtTime(0,t+dur);
  n.connect(f).connect(g);out(g,1,.25,panFor(x));n.start(t);
}
function boom(size,delay,x,far){ // crack + body + sub, then echoes rolling back off the hills
  if(!AC)return;const t=AC.currentTime+delay,pan=panFor(x),k=far?.22:1,top=far?600:2600;
  if(!far){const c=noise(.03),cf=AC.createBiquadFilter(),cg=AC.createGain();cf.type="highpass";cf.frequency.value=700;env(cg,t,.55*size,.001,.035);c.connect(cf).connect(cg);out(cg,1,.6,pan);c.start(t)}
  const b=brown(1.6),bf=AC.createBiquadFilter(),bg=AC.createGain();bf.type="lowpass";bf.frequency.setValueAtTime(top,t);bf.frequency.exponentialRampToValueAtTime(110,t+.7);
  env(bg,t,.9*size*k,.006,1.2);b.connect(bf).connect(bg);out(bg,1,.9,pan);b.start(t);
  const o=AC.createOscillator(),og=AC.createGain();o.frequency.setValueAtTime(58,t);o.frequency.exponentialRampToValueAtTime(27,t+.8);env(og,t,.5*size*k,.008,.9);o.connect(og);out(og,1,.3,pan);o.start(t);o.stop(t+1.1);
  [[.42,.32,-.5],[.95,.2,.45],[1.6,.12,-.2]].forEach(([dt,amp,sh],i)=>{ // echoes, each a little darker and from somewhere else
    const e=brown(1.1),ef=AC.createBiquadFilter(),eg=AC.createGain();ef.type="lowpass";ef.frequency.value=420-i*90;env(eg,t+dt,amp*size*k,.05,.9);
    e.connect(ef).connect(eg);out(eg,1,.8,Math.max(-.8,Math.min(.8,pan+sh)));e.start(t+dt)});
}
function crackle(delay,x,count=46,spread=1.3){ // many tiny pops, densest in the middle
  if(!AC)return;const pan=panFor(x);
  for(let i=0;i<count;i++){const u=(Math.random()+Math.random()+Math.random())/3,t=AC.currentTime+delay+u*spread,n=noise(.008),f=AC.createBiquadFilter(),g=AC.createGain();
    f.type="bandpass";f.Q.value=1.4;f.frequency.value=1400+Math.random()*4200;env(g,t,.05+Math.random()*.09,.0005,.012);
    n.connect(f).connect(g);out(g,1,.45,Math.max(-.9,Math.min(.9,pan+(Math.random()-.5)*.6)));n.start(t)}
}
function sizzle(delay,x,dur=1.8,vol=.02){ // stars burning as they fall
  if(!AC)return;const t=AC.currentTime+delay,n=noise(dur),f=AC.createBiquadFilter(),g=AC.createGain();f.type="highpass";f.frequency.value=3500;
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.25);g.gain.exponentialRampToValueAtTime(.0001,t+dur);n.connect(f).connect(g);out(g,1,.35,panFor(x));n.start(t);
}
const PENTA=[523.25,587.33,659.25,783.99,880,1046.5,1174.66];
function chime(n=3,delay=0){ // furin, the glass wind-bell
  if(!AC)return;for(let i=0;i<n;i++){const t=AC.currentTime+delay+i*(.09+Math.random()*.1),fq=PENTA[Math.floor(Math.random()*PENTA.length)];
    [1,2.76,5.4].forEach((m,j)=>{const o=AC.createOscillator(),g=AC.createGain();o.type="sine";o.frequency.value=fq*m;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.05/(j+1),t+.005);g.gain.exponentialRampToValueAtTime(.0005,t+2.4/(j+1));o.connect(g);out(g,.8,.9);o.start(t);o.stop(t+2.5)})}
}
function puff(size){if(!AC)return;const t=AC.currentTime,n=noise(.5),f=AC.createBiquadFilter(),g=AC.createGain();f.type="lowpass";f.frequency.setValueAtTime(900,t);f.frequency.exponentialRampToValueAtTime(200,t+.4);g.gain.setValueAtTime(.12*size,t);g.gain.exponentialRampToValueAtTime(.001,t+.45);n.connect(f).connect(g);out(g,1,.6);n.start(t)}

 ajisai:(()=>{const p=new Path2D();for(let k=0;k<4;k++){const a=k*Math.PI/2;const m=new DOMMatrix().rotateSelf(k*90);p.addPath(P2("M0 0 C.32 -.15 .32 -.55 0 -.6 C-.32 -.55 -.32 -.15 0 0Z"),m)}return p})(),

/* ================= fireworks + flowers ================= */
let rockets=[],parts=[],flashes=[],rafts=[],smoke=[],glows=[],lamps=[],target=null,lastUser=0;
function launch(x,y,r,type,cols,ambient=false){
  const dur=.9+(HZ-y)/HZ*.6,day=MODE==="day";
  rockets.push({x0:x+(Math.random()-.5)*60,y0:HZ+4,x1:x,y1:y,t:0,dur,r,type,cols:cols.slice(),ambient,day});
  if(!ambient){rise(dur,day,x);if(!day)mortar(x)}
}
function burst(R){
  if(!R.ambient)lastBX=R.x1;
  const {x1:x,y1:y,r,type,ambient,day}=R,dim=ambient?.35:1,K=2.2;
  const pal=day?DAYCOLS:COLS,cs=R.cols.map(k=>hex2(pal[k])),ca=cs[0],cb=cs[1]||cs[0],cc=cs[2]||cb;
  const add=(n,fn,o)=>{for(let i=0;i<n;i++){const u=Math.random()*2-1,ph=Math.random()*Math.PI*2,s=Math.sqrt(1-u*u);const [dx,dy]=fn(i,n,s,ph);
    // each star takes one of your colours; at night it shifts toward the next one as it burns
    const j=Math.floor(Math.random()*cs.length),many=cs.length>1;
    parts.push(Object.assign({x,y,vx:dx,vy:dy,age:0,hist:[],dim,
      c1:cs[j], c2:day?null:(many?cs[(j+1)%cs.length]:lerpC(ca,[255,255,255],.55))},o))}};
  if(!day){
    flashes.push({x,y,r:r*1.3,life:0,max:.4,c:ca,a:.16*dim});
    glows.push({x,y,r:r*2.4,c:ca,life:0,max:1.8,str:dim});
    const nS=ambient?3:7;for(let i=0;i<nS&&smoke.length<140;i++){const a=Math.random()*Math.PI*2,d=Math.random()*r*.55;
      smoke.push({x:x+Math.cos(a)*d,y:y+Math.sin(a)*d*.8,r:r*(.25+Math.random()*.2),gr:6+Math.random()*8,vx:4+Math.random()*5,vy:-1+Math.random()*3,age:0,max:14+Math.random()*8,a:(ambient?.5:1)*(.6+Math.random()*.4)})}
    if(type==="kiku")add(130,(i,n,s,ph)=>[Math.cos(ph)*s*r*K,Math.sin(ph)*s*r*K],{max:1.7+Math.random()*.3,drag:K,g:60,size:1.6,trail:7});
    if(type==="botan"){add(110,(i,n,s,ph)=>[Math.cos(ph)*s*r*K,Math.sin(ph)*s*r*K],{max:1.25,drag:K,g:45,size:2.6,trail:2});
      add(40,(i,n,s,ph)=>[Math.cos(ph)*s*r*K*.45,Math.sin(ph)*s*r*K*.45],{max:1.1,drag:K,g:45,size:2.2,trail:2})}
    if(type==="yanagi")add(80,(i,n,s,ph)=>[Math.cos(ph)*s*r*2.6,Math.sin(ph)*s*r*2.6-30],{max:3.6,drag:1.6,g:95,size:1.7,trail:18,c1:lerpC(ca,[255,236,170],.45),c2:lerpC(cb,[255,226,150],.35),soft:1});
    if(type==="wa"){const tilt=(Math.random()-.5)*.8,sq=.45+Math.random()*.3;
      add(90,(i,n)=>{const a=i/n*Math.PI*2,ex=Math.cos(a),ey=Math.sin(a)*sq;return [(ex*Math.cos(tilt)-ey*Math.sin(tilt))*r*K,(ex*Math.sin(tilt)+ey*Math.cos(tilt))*r*K]},{max:1.6,drag:K,g:30,size:2,trail:5});
      add(24,(i,n,s,ph)=>[Math.cos(ph)*s*r*K*.18,Math.sin(ph)*s*r*K*.18],{max:1.2,drag:K,g:30,size:1.8,trail:2,c1:cc})}
    if(type==="senrin"){add(12,(i,n)=>{const a=i/n*Math.PI*2+Math.random()*.3,m=.55+Math.random()*.45;return [Math.cos(a)*r*K*m,Math.sin(a)*r*K*m]},{max:.6,drag:K,g:40,size:1.6,trail:7,seed:true});if(!ambient)crackle(.95,x,70,1.4)}
    const late=.12+(1-y/HZ)*.3; // light first, sound a beat later
    if(!ambient){boom(Math.min(1,r/170)*.75+.3,late,x,false);
      if(type==="yanagi")sizzle(late+.3,x,3,.03);else if(type==="kiku")sizzle(late+.2,x,1.6,.014);else if(type==="botan")crackle(late+.5,x,18,.8)}
    else boom(.5,late+.35,x,true); // far-off shows, heard faintly
  }else{
    // flowers: petals that flutter, drift and settle on the river
    const pet=(o)=>Object.assign({flower:true,rot:0,vr:(Math.random()-.5)*4,spin:Math.random()*6,spinV:2+Math.random()*4,ph:Math.random()*6},o);
    const out=(i,n,s,ph,k=1)=>[Math.cos(ph)*s*r*K*k,Math.sin(ph)*s*r*K*k];
    if(type==="kiku")add(90,(i,n,s,ph)=>out(i,n,s,ph),pet({max:9,drag:K,g:22,size:14,shape:"kiku",align:true}));
    if(type==="botan"){add(55,(i,n,s,ph)=>out(i,n,s,ph,.9),pet({max:9,drag:K,g:26,size:16,shape:"botan"}));add(20,(i,n,s,ph)=>out(i,n,s,ph,.35),pet({max:9,drag:K,g:26,size:12,shape:"botan"}))}
    if(type==="yanagi")add(80,(i,n,s,ph)=>[Math.cos(ph)*s*r*2.4,Math.sin(ph)*s*r*2.4-30],pet({max:9,drag:1.6,g:70,size:8,shape:"fuji"}));
    if(type==="wa")add(120,(i,n,s,ph)=>out(i,n,s,ph),pet({max:10,drag:K,g:18,size:10,shape:"sakura"}));
    if(type==="senrin")add(10,(i,n)=>{const a=i/n*Math.PI*2+Math.random()*.3,m=.5+Math.random()*.5;return [Math.cos(a)*r*K*m,Math.sin(a)*r*K*m]},{max:.55,drag:K,g:20,size:2,trail:0,seed:true,dayseed:true});
    if(!ambient){puff(Math.min(1,r/170)+.3);chime(type==="senrin"?5:3,.05)}
  }
}
function spawnMini(p){

/* ================= commission ================= */
function setTarget(){const list=COMMISSIONS[MODE],i=prog[MODE];if(freePlay||i>=list.length){target=null;return}
  const C=list[i];target={x:C.fx*W,y:C.fy*HZ,r:C.r*Math.min(1,W/1200),col:palette()[C.col],t:0,done:0}}
function judge(x,y,r){
  const list=COMMISSIONS[MODE];if(freePlay||prog[MODE]>=list.length||!target)return;
  const C=list[prog[MODE]],m=MODE;
  const marks=[["place",Math.hypot(x-target.x,y-target.y)<target.r*.45],["size",Math.abs(r-target.r)<target.r*.32],["flower",shell===C.type],["colour",sel.includes(C.col)]];
  setTimeout(()=>{if(MODE!==m)return;
    $("marks").innerHTML=marks.map(([n,ok])=>`<b class="${ok?"ok":"no"}">${ok?"✓ ":""}${n}</b>`).join("");
    if(marks.every(k=>k[1])){$("q").textContent="Perfect bloom.";target.done=1;setTimeout(()=>{if(MODE!==m)return;prog[m]++;showCommission();setTarget()},2600)}
  },1300);
}

/* ================= drawing helpers ================= */
function drawSpark(c,p,k){
  let a=p.soft? // willow: fades in, then hangs bright and golden before it fades
    p.dim*.9*Math.min(1,.3+p.age*1.4)*(k<.55?1:Math.pow((1-k)/.45,1.2))
    :Math.pow(1-k,1.3)*p.dim;if(k>.7&&Math.random()<.3)a*=.3;
  const col=lerpC(p.c1,p.c2||p.c1,Math.min(1,k*1.6));
  if(p.hist.length>=4){c.strokeStyle=`rgba(${col},${a*.55})`;c.lineWidth=p.size*.75;c.beginPath();c.moveTo(p.hist[0],p.hist[1]);for(let i=2;i<p.hist.length;i+=2)c.lineTo(p.hist[i],p.hist[i+1]);c.lineTo(p.x,p.y);c.stroke()}
  c.fillStyle=`rgba(${col},${a})`;c.beginPath();c.arc(p.x,p.y,p.size*(1-k*.4),0,7);c.fill();
}
function drawPetal(c,p,a,flat=1){
  c.save();c.translate(p.x,p.y);c.rotate(p.rot);c.scale(p.size*(.25+.75*Math.abs(Math.cos(p.spin))),p.size*flat);
  c.globalAlpha=a;c.fillStyle=`rgb(${p.c1})`;c.fill(PETAL[p.shape]);
  c.globalAlpha=a*.38;c.fillStyle="#fff";c.scale(.55,.6);c.fill(PETAL[p.shape]);
  c.restore();
}

/* ================= loop ================= */
let last=performance.now(),ambientT=1.5,simT=0,demoQ=[];
function frame(now,warm){
  const dt=warm?1/60:Math.min(.033,(now-last)/1000);last=now;simT+=dt;const T=simT;
  while(demoQ.length&&demoQ[0][0]<=simT){const [,f]=demoQ.shift();f()}
  mT+=((MODE==="day"?1:0)-mT)*Math.min(1,dt*1.6);
  ambientT-=dt;if(ambientT<0&&now-lastUser>9000){ambientT=3+Math.random()*3;
    launch(W*(.15+Math.random()*.7),HZ*(.25+Math.random()*.3),50+Math.random()*50,SHELLS[Math.floor(Math.random()*5)].id,[Object.keys(COLS)[Math.floor(Math.random()*6)]],true)}

  /* sky: night indigo melts into a soft spring day */
  const g=sx.createLinearGradient(0,0,0,HZ);
  g.addColorStop(0,mixH("#03051a","#8fc6f2"));g.addColorStop(.55,mixH("#0b1240","#c9e4fb"));g.addColorStop(1,mixH("#1d2160","#fbe9f1"));
  sx.globalCompositeOperation="source-over";sx.fillStyle=g;sx.fillRect(0,0,W,HZ);
  if(mT<.98)stars.forEach(s=>{sx.fillStyle=`rgba(238,240,255,${(.25+.35*Math.sin(T*1.3+s.p)**2)*(1-mT)})`;sx.fillRect(s.x,s.y,s.r,s.r)});
  // moon by night, sun by day
  const mx=W*.9,my=HZ*.46-mT*HZ*.22,glow=sx.createRadialGradient(mx,my,0,mx,my,90+mT*80);
  glow.addColorStop(0,mT>.5?`rgba(255,250,235,${.5*mT})`:`rgba(238,240,255,${.18*(1-mT)})`);glow.addColorStop(1,"rgba(255,255,255,0)");
  sx.fillStyle=glow;sx.fillRect(mx-180,my-180,360,360);sx.fillStyle=mixH("#f4f6ff","#fffdf3");sx.beginPath();sx.arc(mx,my,13+mT*7,0,7);sx.fill();
  const dusk=Math.max(0,1-Math.abs(mT-.5)*2.2);
  if(dusk>.01){const dg=sx.createLinearGradient(0,HZ*.25,0,HZ);dg.addColorStop(0,"rgba(122,60,255,0)");dg.addColorStop(.55,`rgba(208,90,170,${.35*dusk})`);dg.addColorStop(1,`rgba(255,150,190,${.55*dusk})`);sx.fillStyle=dg;sx.fillRect(0,0,W,HZ)}
  if(mT>.02)clouds.forEach(c=>{c.x+=c.v*dt;if(c.x-c.s*2>W)c.x=-c.s*2;sx.globalAlpha=.75*mT;
    for(let k=0;k<4;k++){const cx=c.x+(k-1.5)*c.s*.5,cy=c.y+Math.sin(k*1.7)*c.s*.12,rr=c.s*(.45+.15*Math.sin(k*2.3)),cg=sx.createRadialGradient(cx,cy,0,cx,cy,rr);cg.addColorStop(0,"rgba(255,255,255,.8)");cg.addColorStop(1,"rgba(255,255,255,0)");sx.fillStyle=cg;sx.fillRect(cx-rr,cy-rr,rr*2,rr*2)}sx.globalAlpha=1});

  sx.globalCompositeOperation="lighter";
  flashes.forEach(f=>{f.life+=dt;const a=f.a*(1-f.life/f.max)*(1-mT);const fg=sx.createRadialGradient(f.x,f.y,0,f.x,f.y,f.r*2.2);fg.addColorStop(0,`rgba(${f.c},${a})`);fg.addColorStop(1,`rgba(${f.c},0)`);sx.fillStyle=fg;sx.fillRect(0,0,W,HZ)});
  flashes=flashes.filter(f=>f.life<f.max);
  glows.forEach(g=>g.life+=dt);glows=glows.filter(g=>g.life<g.max);
  smoke.forEach(m=>{m.age+=dt;m.x+=m.vx*dt;m.y+=m.vy*dt;m.r+=m.gr*dt*(1-m.age/m.max)});smoke=smoke.filter(m=>m.age<m.max);
  if(mT<.98)smoke.forEach(m=>{const k=m.age/m.max,fade=Math.min(1,m.age*1.5)*(1-k)*(1-mT)*m.a;
    sx.globalCompositeOperation="source-over";const hg=sx.createRadialGradient(m.x,m.y,0,m.x,m.y,m.r);hg.addColorStop(0,`rgba(120,128,170,${.1*fade})`);hg.addColorStop(1,"rgba(120,128,170,0)");sx.fillStyle=hg;sx.fillRect(m.x-m.r,m.y-m.r,m.r*2,m.r*2);
    let L=[0,0,0];glows.forEach(g=>{const d=Math.hypot(m.x-g.x,m.y-g.y);if(d>g.r)return;const w=(1-d/g.r)*Math.pow(1-g.life/g.max,1.6)*g.str;L[0]+=g.c[0]*w;L[1]+=g.c[1]*w;L[2]+=g.c[2]*w});
    const lw=Math.max(L[0],L[1],L[2]);if(lw>4){sx.globalCompositeOperation="lighter";const s=Math.min(1,lw/255),c=L.map(v=>Math.round(v/lw*255)),lg=sx.createRadialGradient(m.x,m.y,0,m.x,m.y,m.r);lg.addColorStop(0,`rgba(${c},${.4*s*fade})`);lg.addColorStop(1,`rgba(${c},0)`);sx.fillStyle=lg;sx.fillRect(m.x-m.r,m.y-m.r,m.r*2,m.r*2)}});
  sx.globalCompositeOperation="lighter";
  sx.globalCompositeOperation="source-over";

  const ink=mixH("#eef0ff","#3a3a66");
  if(target&&!window.CLEAN){target.t+=dt;const a=target.done?Math.max(0,.6-target.t*.2):.28+.1*Math.sin(T*2);
    sx.save();sx.setLineDash([2,7]);sx.lineWidth=1.3;sx.strokeStyle=target.col;sx.globalAlpha=a;sx.beginPath();sx.arc(target.x,target.y,target.r,0,7);sx.stroke();sx.restore()}
  if(hold){const r=sizeFor((now-hold.t0)/1000);sx.save();sx.strokeStyle=palette()[sel[0]];sx.globalAlpha=.7;sx.lineWidth=1.2;sx.setLineDash([1,5]);sx.beginPath();sx.arc(hold.x,hold.y,r,0,7);sx.stroke();sx.setLineDash([]);sx.beginPath();sx.arc(hold.x,hold.y,2.5,0,7);sx.fillStyle=ink;sx.fill();sx.restore()}

  // rockets (night) and rising buds (day)
  rockets.forEach(R=>{R.t+=dt/R.dur;const e=1-(1-Math.min(1,R.t))**2,x=R.x0+(R.x1-R.x0)*e+Math.sin(R.t*20)*1.2,y=R.y0+(R.y1-R.y0)*e;
    if(R.day){if(Math.random()<.35)parts.push({flower:true,shape:"fuji",x,y,vx:(Math.random()-.5)*15,vy:15,age:0,hist:[],c1:[120,190,140],dim:R.ambient?.4:.8,max:1,drag:2,g:20,size:4,rot:Math.random()*6,vr:2,spin:0,spinV:3,ph:0});

const CABIN=new Path2D("M-36 -4 L-36 -21 L30 -21 L30 -4Z");
const ROOF=new Path2D("M-43 -20 Q-4 -27 37 -20 L34 -25 Q-4 -33 -40 -25Z");
const PUNT=new Path2D("M-34 -2 L30 -2 Q40 -5 44 -12 L41 -1 Q37 5 28 6 L-28 6 Q-35 5 -36 0Z");
function drawBoat(b,dt,T){
  const span=W+260;b.x+=b.v*dt;if(b.x>W+130)b.x-=span;if(b.x<-130)b.x+=span;
  const y=HZ+8+b.d*(H-HZ)*.62+Math.sin(T*1.1+b.ph)*1.4,tilt=Math.sin(T*.8+b.ph)*.025,sc=b.s*Math.min(1.2,W/1100+.2),dir=b.v<0?-1:1;
  const night=1-mT,hull=mixH("#05061a","#6b4c43"),cab=mixH("#0a0d2c","#f3ece0"),roof=mixH("#03040f","#3f4a5a");
  const lights=[-28,-18,-8,2,12,22];
  // reflection: a dark squashed copy, and the lit windows smeared as shimmer
  ctx.save();ctx.translate(b.x,y+9*sc);ctx.scale(sc*dir,-sc*.55);ctx.globalAlpha=.28;ctx.fillStyle=hull;ctx.fill(b.k==="house"?HULL:PUNT);ctx.restore();
  if(b.k==="house"&&night>.05){ctx.save();ctx.globalCompositeOperation="lighter";
    lights.forEach((lx,i)=>{for(let j=0;j<5;j++){const yy=y+12*sc+j*4*sc,xx=b.x+lx*sc*dir+Math.sin(T*3+j+i)*2.5*sc;ctx.fillStyle=`rgba(255,214,234,${.16*night*(1-j/5)})`;ctx.fillRect(xx-3*sc,yy,6*sc,1.6*sc)}});
    ctx.restore()}
  ctx.save();ctx.translate(b.x,y);ctx.rotate(tilt);ctx.scale(sc*dir,sc);
  if(b.k==="house"){
    ctx.fillStyle=cab;ctx.fill(CABIN);
    // windows: warm by night, shaded by day
    lights.forEach(lx=>{ctx.fillStyle=night>.5?`rgba(255,226,236,${.55+.35*night})`:"rgba(70,80,100,.35)";ctx.fillRect(lx,-17,7,9)});
    ctx.fillStyle=roof;ctx.fill(ROOF);
    // a string of paper lanterns under the eaves
    for(let i=0;i<7;i++){const lx=-36+i*11,ly=-19+Math.sin(i*.9)*.6;
      if(night>.05){ctx.globalCompositeOperation="lighter";const g=ctx.createRadialGradient(lx,ly,0,lx,ly,9);g.addColorStop(0,`rgba(255,126,182,${.55*night})`);g.addColorStop(1,"rgba(255,126,182,0)");ctx.fillStyle=g;ctx.fillRect(lx-9,ly-9,18,18);ctx.globalCompositeOperation="source-over"}
      ctx.fillStyle=mixH("#ff9cc7","#d9566f");ctx.beginPath();ctx.ellipse(lx,ly,2.2,2.8,0,0,7);ctx.fill()}
  }else{
    // a boatman with a pole
    ctx.fillStyle=mixH("#03040f","#2f3442");ctx.beginPath();ctx.ellipse(-14,-14,3.4,6.5,0,0,7);ctx.fill();
    ctx.beginPath();ctx.ellipse(-14,-22,6.5,2,0,0,7);ctx.fill(); // straw hat
    ctx.strokeStyle=mixH("#03040f","#5b4a3e");ctx.lineWidth=1.2;ctx.beginPath();ctx.moveTo(-26,-30);ctx.lineTo(-4,8);ctx.stroke();
    if(night>.05){ctx.globalCompositeOperation="lighter";const g=ctx.createRadialGradient(26,-14,0,26,-14,14);g.addColorStop(0,`rgba(255,226,236,${.7*night})`);g.addColorStop(1,"rgba(255,226,236,0)");ctx.fillStyle=g;ctx.fillRect(12,-28,28,28);ctx.globalCompositeOperation="source-over";
      ctx.fillStyle="#ffe2ec";ctx.beginPath();ctx.ellipse(26,-14,2.4,3.2,0,0,7);ctx.fill()}
    ctx.strokeStyle=mixH("#03040f","#5b4a3e");ctx.beginPath();ctx.moveTo(26,-2);ctx.lineTo(26,-11);ctx.stroke();
  }
  ctx.fillStyle=hull;ctx.fill(b.k==="house"?HULL:PUNT);
  ctx.restore();
}

/* little live preview in the tray of what you'll launch */
const pv=$("pv"),pc=pv.getContext("2d");let pvT=0;
function drawPreview(dt){
  pvT+=dt;pc.setTransform(1,0,0,1,0,0);pc.clearRect(0,0,92,92);pc.translate(46,46);
  const pal=palette(),day=MODE==="day",cs=sel.map(k=>hex2(pal[k]));
  pc.fillStyle=day?"rgba(255,255,255,.55)":"rgba(3,5,26,.85)";pc.beginPath();pc.arc(0,0,44,0,7);pc.fill();
  const grow=Math.min(1,pvT*1.5),n=day?10:24;
  for(let i=0;i<n;i++){const a=i/n*Math.PI*2+pvT*.3,rr=grow*30,c=cs[i%cs.length];
    if(day){const shape={kiku:"kiku",botan:"botan",yanagi:"fuji",wa:"sakura",senrin:"ajisai"}[shell];
      pc.save();pc.translate(Math.cos(a)*rr*.75,Math.sin(a)*rr*.75+(shell==="yanagi"?grow*8:0));pc.rotate(a+Math.PI/2);pc.scale(9,9);pc.fillStyle=`rgb(${c})`;pc.fill(PETAL[shape]);pc.restore()}
    else{pc.strokeStyle=`rgba(${c},.8)`;pc.lineWidth=1.2;pc.beginPath();pc.moveTo(Math.cos(a)*rr*.35,Math.sin(a)*rr*.35);pc.lineTo(Math.cos(a)*rr,Math.sin(a)*rr+(shell==="yanagi"?grow*10:0));pc.stroke()}}
  if(pvT>2.4)pvT=0;
}

/* ================= your show: finale + keepsake ================= */
let show=[],finaleOn=false;
function remember(x,y,r){show.push({fx:x/W,fy:y/HZ,r,type:shell,cols:sel.slice()});if(show.length>40)show.shift();$("fin").hidden=show.length<3}
$("fin").onclick=()=>{ // everything you launched, again, faster, then a closing salvo
  if(finaleOn||!show.length)return;audio();finaleOn=true;$("fin").textContent="✦ ✦ ✦";
  const gap=Math.max(.12,Math.min(.35,4/show.length));
  show.forEach((f,i)=>setTimeout(()=>launch(f.fx*W,f.fy*HZ,f.r,f.type,f.cols),i*gap*1000));
  const end=show.length*gap*1000+500,all=[...new Set(show.flatMap(f=>f.cols))];
  [.18,.34,.5,.66,.82].forEach((fx,i)=>setTimeout(()=>launch(fx*W,HZ*(.22+(i%2)*.1),200,i%2?"kiku":"botan",[all[i%all.length]]),end+i*90));
  setTimeout(()=>{finaleOn=false;$("fin").textContent="finale ✦"},end+3000);
};
/* keep this sky: the moment is frozen when you press, then saved as a postcard or a wallpaper */
let snap=null,lastBX=null;
const sealAt=(g,x,y,sz,paper)=>{g.save();g.translate(x,y);g.rotate(-.06);const h=sz/2;
  g.fillStyle="#c8243c";g.fillRect(-h,-h,sz,sz);g.strokeStyle=paper;g.lineWidth=sz*.03;g.strokeRect(-h*.85,-h*.85,sz*.85,sz*.85);
  g.fillStyle=paper;g.font=`600 ${sz*.37}px "Shippori Mincho", serif`;g.textAlign="center";g.fillText("花",0,-sz*.04);g.fillText("火",0,sz*.35);g.restore()};
function cover(g,src,dw,dh,cx){ // crop the frozen sky to fill dw x dh, centred on cx (0..1)
  const sw=src.width,sh=src.height,sc=Math.max(dw/sw,dh/sh),cw=dw/sc,ch=dh/sc;
  const x=Math.max(0,Math.min(sw-cw,cx*sw-cw/2)),y=Math.max(0,(sh-ch)/2);g.drawImage(src,x,y,cw,ch,0,0,dw,dh)}
const FORMATS={
 card(){const PW=1600,m=60,iw=PW-m*2,ih=Math.round(iw*snap.height/snap.width),c=document.createElement("canvas");c.width=PW;c.height=ih+m*2+120;
   const g=c.getContext("2d"),day=MODE==="day";g.fillStyle="#f7f1e6";g.fillRect(0,0,c.width,c.height);
   g.save();g.shadowColor="rgba(40,30,60,.25)";g.shadowBlur=30;g.shadowOffsetY=10;g.fillRect(m,m,iw,ih);g.restore();g.drawImage(snap,m,m,iw,ih);
   const ty=m+ih+70,when=new Date().toLocaleDateString("en-GB",{day:"numeric",month:"long",year:"numeric"});
   g.fillStyle="#2a2440";g.font='400 44px "Shippori Mincho", serif';g.fillText("Fire Flowers  花火",m,ty);
   g.font='400 22px "Zen Kaku Gothic New", sans-serif';g.fillStyle="rgba(42,36,64,.6)";g.fillText(`${when} · ${(day?"a "+SEASON+" day of flowers":"a "+SEASON+" night of fire flowers")} · ${show.length} launched`,m,ty+38);
   sealAt(g,PW-m-55,ty-7,104,"#f7f1e6");
   g.font='400 16px "Zen Kaku Gothic New", sans-serif';g.fillStyle="rgba(42,36,64,.45)";g.textAlign="right";g.fillText("fire-flowers.vercel.app",PW-m-130,ty+38);return c},
 desk(){const c=document.createElement("canvas");c.width=2560;c.height=1440;const g=c.getContext("2d");g.imageSmoothingQuality="high";
   cover(g,snap,2560,1440,.5);sealAt(g,2560-90,1440-90,70,"#f7f1e6");return c},
 phone(){const h=Math.min(2532,snap.height*2),w=Math.round(h*1170/2532),c=document.createElement("canvas");c.width=w;c.height=h;const g=c.getContext("2d");g.imageSmoothingQuality="high";
   cover(g,snap,w,h,lastBX!=null?lastBX/W:.5);sealAt(g,w/2,h-h*.06,h*.035,"#f7f1e6");return c},
};
const NAMES={card:"postcard",desk:"desktop",phone:"phone"};
function saveCanvas(c,name){
  c.toBlob(blob=>{
    const file=new File([blob],name,{type:"image/png"});
    // on phones the share sheet offers "Save Image" straight to Photos; elsewhere it downloads
    if(matchMedia("(pointer:coarse)").matches&&navigator.canShare&&navigator.canShare({files:[file]})){navigator.share({files:[file],title:"Fire Flowers 花火"}).catch(()=>{});return}
    const a=document.createElement("a");a.download=name;a.href=URL.createObjectURL(blob);document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},2000);
  },"image/png");
}
$("keep").onclick=()=>{
  window.CLEAN=1;frame(performance.now(),true);window.CLEAN=0; // redraw once without the commission circle
  snap=document.createElement("canvas");snap.width=cv.width;snap.height=cv.height;snap.getContext("2d").drawImage(cv,0,0);
  const pv=$("snapv"),pg=pv.getContext("2d");pv.width=480;pv.height=Math.round(480*snap.height/snap.width);pg.drawImage(snap,0,0,pv.width,pv.height);
  $("sheet").hidden=false;
};
$("sheet").addEventListener("click",e=>{
  const b=e.target.closest("[data-f]");if(b&&snap){saveCanvas(FORMATS[b.dataset.f](),`fire-flowers-${NAMES[b.dataset.f]}-${new Date().toISOString().slice(0,10)}.png`);
    b.classList.add("done");setTimeout(()=>b.classList.remove("done"),1600)}
  if(e.target.id==="sx"||e.target.id==="sheet")$("sheet").hidden=true;
});

buildTray();showCommission();setTarget();addEventListener("resize",setTarget);
const Q=new URLSearchParams(location.search);if(Q.get("season")){setSeason(Q.get("season"));sT=1}
if(Q.get("mode")==="day"){setMode("day");mT=1}
if(Q.has("demo")){
  lastUser=performance.now()+1e9;
  const show=Q.has("one")?[[Q.get("one"),[Q.get("c")||"kingfisher"],.5,.3,170]]:[["kiku",["kingfisher"],.5,.26,170],["botan",["sakura","silver"],.25,.42,100],["wa",["wisteria"],.76,.22,110],["yanagi",["silver"],.64,.34,150],["senrin",["jade"],.36,.22,120]];
  show.forEach(([t,c,fx,fy,r],i)=>demoQ.push([i*.18,()=>launch(fx*W,fy*HZ,r,t,c)]));
  if(Q.has("lamps"))[[.2,.1],[.34,.3],[.47,.18],[.6,.4],[.8,.22]].forEach(([fx,fd])=>floatLamp(W*fx,HZ+(H-HZ)*fd));
  const until=+(Q.get("t")||0);for(let i=0;i<until*60;i++)frame(performance.now(),true);
}
requestAnimationFrame(frame);
